name: CI

# Boots the real app against a freshly seeded SQLite file and drives it over HTTP:
# the public site, a rejected password, and one sign-in per role. No mocks — if the
# server, the seed data, the session or a route breaks, this job goes red.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PORT: 3111
      SESSION_SECRET: ci-only-secret-not-for-deployments
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax-check every source file
        run: |
          set -euo pipefail
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check
          echo "all .js files parse"

      # Boots the server (auto-seeds a throwaway demo database), waits for /healthz,
      # then drives the public site and all three logins over HTTP. Same file you can
      # run locally: `npm run smoke`.
      - name: Smoke test — boot the portal and sign in to every role
        run: npm run smoke
